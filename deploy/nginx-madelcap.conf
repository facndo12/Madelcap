# IMPORTANTE: reemplazar MADELCAP_HOST por el hostname real antes de habilitar.
#
# No poner `server_name _` ni `default_server` en este archivo. En un VPS que
# aloja varios sitios, nginx elige como servidor por defecto al primer bloque
# que carga (sites-enabled se incluye por orden alfabetico), asi que un
# catch-all llamado "madelcap" pasaria a recibir todo el trafico cuyo Host no
# coincida con ningun otro sitio.
server {
    listen 80;
    listen [::]:80;
    server_name MADELCAP_HOST;

    root /var/www/madelcap/current/dist;
    index index.html;

    access_log /var/log/nginx/madelcap.access.log;
    error_log /var/log/nginx/madelcap.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { font/woff2 woff2; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
