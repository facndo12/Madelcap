# Va en el nginx DEL HOST, no en el contenedor.
#
# Traefik redirige web -> websecure, pero ese entrypoint escucha el puerto 80
# dentro del contenedor y en este VPS el 80 del host lo tiene nginx. O sea que
# un visitante que escriba http:// nunca llega a Traefik: cae en nginx, no
# matchea ningun server_name y termina en el sitio por defecto, que es otro
# proyecto. Este bloque lo manda a https, que si va a Traefik.
#
# server_name explicito y sin default_server, para no quedarse con trafico
# ajeno en un servidor que aloja varios sitios.
#
# Instalar:
#   sudo cp deploy/nginx-host-redirect.conf /etc/nginx/sites-available/madelcap
#   sudo ln -s /etc/nginx/sites-available/madelcap /etc/nginx/sites-enabled/madelcap
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name madelcap.consultoriadigital.io;

    return 301 https://$host$request_uri;
}
