# Config de nginx DENTRO del contenedor de la landing.
# Aca `server_name _` es correcto: el contenedor aloja un solo sitio y quien
# decide que hostname entra es Traefik. No confundir con
# nginx-madelcap.conf, que va en el host y si necesita server_name explicito.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # QUITAR ESTA LINEA CUANDO EL SITIO SEA EL DEFINITIVO.
    # Mientras esto sea un preview en un subdominio de consultoriadigital.io,
    # no puede indexarse: competiria con el sitio real de la clinica por
    # "clinica en Nemby" y quedaria contenido duplicado en el dominio
    # equivocado.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    # Ojo con nginx: un `add_header` dentro de un location ANULA todos los del
    # bloque server, no los suma. Por eso hay que repetir aca los que
    # importan para estos archivos, o las imagenes y la fuente quedarian sin
    # nosniff y sin el noindex del preview.
    location /images/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        types { font/woff2 woff2; }
        try_files $uri =404;
    }

    # =404 y no /index.html: la landing no tiene rutas de cliente, asi que
    # devolver el index ante una URL inexistente solo esconderia enlaces rotos
    # y le daria a Google un soft 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
