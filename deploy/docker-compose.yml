# Publica la landing detras del Traefik que ya corre en el VPS.
#
# Por que asi y no con el nginx del host: en ese servidor el puerto 80 lo
# ocupa nginx (con varios sitios) y el 443 lo ocupa Traefik. Meter certbot
# en el nginx del host lo haria intentar escuchar en 443, chocar con Traefik
# y podria dejar caidos tambien los sitios del 80. Traefik ya emite
# certificados con TLS-ALPN-01, que valida por el 443, asi que no necesita
# el puerto 80 para nada.
#
# Este contenedor no publica ningun puerto al host: Traefik lo alcanza por la
# red interna. No hay conflicto posible con lo que ya corre.
#
# El hostname sale de MADELCAP_HOST. Por defecto usa el que Hostinger ya
# provee para este VPS, que no requiere comprar dominio ni tocar DNS.
# Para usar otro:
#   MADELCAP_HOST=madelcap.consultoriadigital.io docker compose -f deploy/docker-compose.yml up -d
#
# Uso:
#   cd /var/www/madelcap/current
#   npm run build
#   docker compose -f deploy/docker-compose.yml up -d

services:
  madelcap-web:
    image: nginx:alpine
    container_name: madelcap-web
    restart: unless-stopped
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.madelcap.rule=Host(`${MADELCAP_HOST:-madelcap.srv1224751.hstgr.cloud}`)"
      - "traefik.http.routers.madelcap.entrypoints=websecure"
      - "traefik.http.routers.madelcap.tls=true"
      - "traefik.http.routers.madelcap.tls.certresolver=mytlschallenge"
      - "traefik.http.services.madelcap.loadbalancer.server.port=80"

networks:
  # La red que ya usa el stack de n8n. Externa: este compose no la crea ni la
  # administra, solo se conecta.
  n8n_default:
    external: true
